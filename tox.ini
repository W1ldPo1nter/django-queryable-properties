[tox]
envlist =
    flake8
    py27-django{14,15,16,17,18,19,110,111}
    py35-django{18,19,110,111,20,21,22}
    py36-django{111,20,21,22,30,31,32}
    py37-django{111,20,21,22,30,31,32}
    py38-django{22,30,31,32,40,41,42}
    py39-django{22,30,31,32,40,41,42}
    py310-django{32,40,41,42,50,51,52}
    py311-django{41,42,50,51,52}
    py312-django{42,50,51,52,60,61}
    py313-django{51,52,60,61}
    py314-django{52,60,61}


[testenv:flake8]
deps = flake8
commands = flake8 {toxinidir}/queryable_properties {toxinidir}/tests


[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    django14: -r{toxinidir}/requirements/django14.txt
    django15: -r{toxinidir}/requirements/django15.txt
    django16: -r{toxinidir}/requirements/django16.txt
    django17: -r{toxinidir}/requirements/django17.txt
    django18: -r{toxinidir}/requirements/django18.txt
    django19: -r{toxinidir}/requirements/django19.txt
    django110: -r{toxinidir}/requirements/django110.txt
    django111: -r{toxinidir}/requirements/django111.txt
    django20: -r{toxinidir}/requirements/django20.txt
    django21: -r{toxinidir}/requirements/django21.txt
    django22: -r{toxinidir}/requirements/django22.txt
    django30: -r{toxinidir}/requirements/django30.txt
    django31: -r{toxinidir}/requirements/django31.txt
    django32: -r{toxinidir}/requirements/django32.txt
    django40: -r{toxinidir}/requirements/django40.txt
    django41: -r{toxinidir}/requirements/django41.txt
    django42: -r{toxinidir}/requirements/django42.txt
    django50: -r{toxinidir}/requirements/django50.txt
    django51: -r{toxinidir}/requirements/django51.txt
    django52: -r{toxinidir}/requirements/django52.txt
    django60: -r{toxinidir}/requirements/django60.txt
    django61: -r{toxinidir}/requirements/django61.txt
commands =
    py.test --basetemp={envtmpdir} {posargs}
passenv =
    TOXENV
    GITHUB_*
